<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | DriveWise AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='cssstyle.css') }}">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle p-3 mb-2" style="width: 60px; height: 60px;">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h3 class="fw-bold mb-1 text-dark">Welcome back</h3>
        <p class="text-secondary small">Access your DriveWise matchmaking portal</p>
      </div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show small py-2 px-3 border-0 rounded-3 mb-3" role="alert">
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="padding: 0.8rem 0.8rem;"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 rounded-start-3"><i class="bi bi-person text-secondary"></i></span>
            <input type="text" class="form-control border-start-0 rounded-end-3" id="username" name="username" placeholder="Enter username" required>
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 rounded-start-3"><i class="bi bi-lock text-secondary"></i></span>
            <input type="password" class="form-control border-start-0 rounded-end-3" id="password" name="password" placeholder="Enter password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
      </form>

      <div class="text-center">
        <p class="text-secondary small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none text-primary">Register here</a></p>
        <div class="mt-3">
          <a href="{{ url_for('home') }}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Homepage</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
